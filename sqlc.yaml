version: "2"

sql:
  - engine: "postgresql"

    schema: "sql/migrations"

    queries: "sql/queries"

    gen:
      go:
        package: "sqlc"

        out: "internal/db/sqlc"

        sql_package: "pgx/v5"

        emit_json_tags: true

        emit_interface: true

        emit_empty_slices: true

        emit_exact_table_names: false

        overrides:
          - db_type: "principal_type"
            go_type: "string"
          - db_type: "policy_effect"
            go_type: "string"